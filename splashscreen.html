<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlankMail</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0c1222 0%, #151030 35%, #1a0a2e 65%, #0f172a 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .logo {
      width: 220px;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.1s forwards;
    }

    .loader {
      display: flex;
      gap: 6px;
      margin-top: 32px;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.4s forwards;
    }

    .loader span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #818cf8;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .loader span:nth-child(2) { animation-delay: 0.2s; }
    .loader span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <!-- BlankMail logo (placeholder) — inline SVG, no external dependencies -->
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" fill="none">
    <rect x="2" y="6" width="52" height="52" rx="12" fill="#6366F1"/>
    <rect x="13" y="20" width="30" height="22" rx="3" stroke="#fff" stroke-width="3.5"/>
    <path d="M15 22.5 28 32l13-9.5" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="45" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="600" letter-spacing="-0.5">BlankMail</text>
  </svg>

  <div class="loader">
    <span></span>
    <span></span>
    <span></span>
  </div>
</body>
</html>
